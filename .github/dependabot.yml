# Dependabot version updates (EXTRACTION §3.4). Security alerts and security fixes are repository
# settings, enabled at the public flip; this file adds the scheduled version bumps. Actions are
# SHA-pinned in the workflows, so the github-actions ecosystem keeps the pins current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
