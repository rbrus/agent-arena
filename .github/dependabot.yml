# Dependabot version updates (EXTRACTION §3.4). Security alerts and security fixes are repository
# settings, enabled at the public flip; this file adds the scheduled version bumps. Actions are
# SHA-pinned in the workflows, so the github-actions ecosystem keeps the pins current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # one PR per week for every minor and patch bump; majors stay separate so a break is legible
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
