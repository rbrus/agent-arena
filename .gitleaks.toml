# gitleaks config for rbrus/agent-arena (copied to the public repo root).
# Default ruleset, plus THREE narrow allowlists. Provider-specific rules (cloud
# keys, GitHub/npm tokens, private keys, ...) are never allowlisted anywhere.
#
# Needs gitleaks >= 8.25.0 (multiple [[allowlists]] with targetRules; CI pins
# 8.30.1). gitleaks 8.24.x silently IGNORES [[allowlists]]: every allowlist
# below would be a no-op there (EXTRACTION-DRYRUN.md, 2026-09-26).
title = "agent-arena"

[extend]
useDefault = true

# 1. Contract/doc examples explicitly marked as examples. Contract authors must
# mark every example credential with the literal EXAMPLE (e.g. wotk_sk_EXAMPLE...,
# eyJ...EXAMPLE_SIG); an unmarked credential-shaped example is a finding by design.
[[allowlists]]
description = "Explicitly marked example credentials in contracts and docs"
# targetRules is load-bearing: without it gitleaks >= 8.25 prunes the whole
# contracts/ and docs/ directories in `dir` mode (the AND condition is not
# applied to directory pruning), so unmarked examples would pass unscanned.
targetRules = ["generic-api-key", "jwt"]
condition = "AND"
paths = ['''^(contracts|docs)/''']
regexTarget = "line"
regexes = ['''EXAMPLE''']

# 2. Values that every report DISCLOSES after the run is terminal (commit-reveal):
# the raid blinding key and the Diplomacy episode secret (report.schema.json,
# episode_result.schema.json). They appear in schema examples, golden fixtures
# and the inspector's sample reports; they are not credentials.
[[allowlists]]
description = "Post-run disclosed commit-reveal values (64 lower-case hex) in JSON"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(blinding_key|blindingKey|episode_secret)"?\s*[:=]\s*"?[0-9a-f]{64}''']

# 3. Synthetic credential-shaped strings in test sources (redaction, credential
# refusal and log-hygiene tests need them). Only the two generic heuristics are
# relaxed there; a real provider key in a test file is still a finding.
[[allowlists]]
description = "Synthetic credentials in test code (generic heuristics only)"
targetRules = ["generic-api-key", "jwt"]
paths = ['''^(packages|services|agents|qa|frontend)/([^/]+/)?test/''']

# 4. Run-token conformance vectors (contracts signing.md §10): compact JWS
# signed with the PUBLIC RFC 8032 §7.1 TEST 1 Ed25519 key, audience
# agent.example.com. Only the jwt rule, only this one file (dry run 2).
[[allowlists]]
description = "Run-token test vectors signed with the RFC 8032 test key"
targetRules = ["jwt"]
paths = ['''^contracts/fixtures/signing_vectors\.json$''']
