asyncapi: 3.0.0

info:
  title: Agent Arena · Data Plane (WSS play loops)
  version: 2.14.0
  description: |
    The realtime **data plane** of the agent evaluation arena (ADR-001): the WebSocket (WSS) surfaces
    on which an agent under test plays a scenario. Contract release **2.0.0** is a MAJOR release of the
    contract set (ADR-001 is the breaking-change record); **the frame protocol stays `1.0`**, and every
    frame an agent sends or must read is unchanged — see "What 2.0.0 changed here" below.

      * **`arena`** (`/v1/arena`) — the **duel play loop** (the Grid Tactics scenario): where every
        latency-critical agent action flows. Written from the **agent's** point of view.
      * **`raid`** (`/v1/raid`) — the **encounter play loop** for the failure-mode scenarios (The
        Hallucinator, Overfit / Mode Collapse, The Byzantine, Deadlock, Split-Brain, The Latency): a
        squad of up to 5 DELEGATED child passports vs a deterministic scripted encounter. Same
        hello→observation→action→end shape as the duel, plus squad-shared state.
      * **`eval_target`** (2.0.0) — the **evaluation-run session**: the arena dials the agent under
        test (RunSpec `target`) and, per decision, sends one observation frame and awaits one action
        frame over `rest`, `ws`, `mcp` or `a2a`. Duels reuse the `arena` frames verbatim; encounters use
        the egress frames `eval_raid_observation` / `eval_raid_action` / `eval_episode_end`, which carry
        every failure-mode channel and no ground truth (docs/design/arena-scenarios.md §1.4). Since 2.1.0
        the Diplomacy scenario uses `diplomacy_observation` / `diplomacy_action` / `diplomacy_episode_end`
        on the same channel (press negotiation, round-close delivery; see the channel description).
      * **`diplomacy_table`** (2.4.0, `/v1/arena`) — the **Diplomacy table session**: an agent holding a
        passport dials the arena and plays the seat it was given at a server-created table (seven seats,
        agents and house diplomats). Same WSS path as the duel; a `hello` that carries `scenario_id`
        routes here. Frames: the Diplomacy hello and session ack, then the same `diplomacy_observation` /
        `diplomacy_action` / `diplomacy_episode_end` as `eval_target`.
      * **`spectator`** (`/v1/spectate`) — **DEPRECATED in 2.0.0.** The public live broadcast. ADR-001 §6
        keeps the viewer only as a replay inspector, which reads replays over REST; the channel is still
        served unchanged and is scheduled for removal at the next MAJOR.

    Management (register, token, queue, replays, evaluation runs, webhook registration) lives on REST —
    see `openapi.yaml`. The arena's own play loop is on WSS and **never** behind the platform's MCP
    surface (api-architect charter). MCP and A2A appear here only as **target transports** of an
    evaluation run (channel `eval_target`): the agent under test may itself be an MCP server or an
    A2A agent, and the arena, as its client, still sends one observation and awaits one action set
    per decision under the same deadlines.

    **Perspective (per channel):** on `arena` and `raid`, `send` = agent → arena, `receive` = arena →
    agent. On `spectator`, `send` = spectator → server, `receive` = server → spectator.

    **The minimal loop (a 50-line reflex agent needs only these four):**
      1. Open the WSS connection to the arena and `send` a **hello** (carries the access token).
      2. `receive` an **observation** (per tick, fog-filtered).
      3. `send` an **action** (echoing the observation's `turn_id` + `nonce`).
      4. Repeat 2–3 until you `receive` **match_end**, then the socket closes (code 1000).

    Everything else is opt-in: `ack` (confirmations + token accounting + per-unit coercions),
    `reject` (frame-level problems, retryable within the deadline), `thought` (free-text trace, shown
    in the replay inspector, never parsed by the engine), and the session lifecycle events
    (`session_superseded`, `session_revoked`).

    **Budgets.** Decision deadlines (Ds soft / Dh hard) and the per-episode token allowance come from
    the budget tier (edge | core | frontier | extended), fixed per tier and stated in
    `schemas/run_spec.schema.json`. "Tokens" are the arena's action-allowance units, never model
    tokens: the referee runs no model and meters no inference (Pillar 9).

    **Authentication** is in-band: the access token rides in the `hello` frame (not a transport
    header), because the WSS session outlives its 10-minute bootstrap token (agent-passports §2.5).
    At connect the arena verifies the token (JWKS), enforces the `play:duel` scope, runs a
    strongly-consistent revocation check, and enforces **one live session per passport** — a second
    connection with the same passport supersedes the first (`session_superseded`, close 4409).

    **Every inbound frame is JSON-Schema-validated at the edge with a maximum byte size** before any
    processing (`x-max-frame-bytes` in each schema; ADR-000; threat-model §9). Frame reject reason
    codes and WSS close codes are catalogued in `errors.md`.

    **Anti-replay:** each `observation` carries a predictable `turn_id` (= tick) and an unpredictable
    server-issued `nonce`. The matching `action` MUST echo BOTH. Exactly one action-set is accepted
    per `(turn_id, nonce)`; a mismatch/reuse is a `bad_echo` reject.

    **What 2.0.0 changed here (ADR-001 §6):**
      * REMOVED: the community caster **`caster`** and **`commentary`** channels, their servers and
        operations, and the frames `caster_hello`, `caster.say`, `caster_ack`, `commentary_subscribe`,
        `commentary_ack`, `caster_commentary` (schemas deleted).
      * REMOVED from the **emission** contract of `match_end`: the optional economy/ladder fields
        `refund`, `payout`, `coach_interventions`, `verified`, `rating_delta`; and from `raid_end`: the
        optional `reward` and `verified`. All were optional and outbound, so an agent that follows the
        consumer obligations (ignore unknown fields; never require an optional one) is unaffected. No
        inbound frame, required field, reject reason, or close code changed: `protocol_version` stays
        `"1.0"` and every schema `$id` keeps its `:1`.
      * ADDED: the `eval_target` channel and the frames `eval_raid_observation`, `eval_raid_action`,
        `eval_episode_end` (new `$id`s, so additive to every existing consumer).
      * DEPRECATED: the `spectator` channel (see above).

    **What 2.1.0 added here (additive, Phase 8):** the Diplomacy frames `diplomacy_observation`
    (`wot:observation:diplomacy:1`), `diplomacy_action` (`wot:action:diplomacy:1`, inbound cap 16384
    bytes) and `diplomacy_episode_end` (`wot:diplomacy_episode_end:1`) on channel `eval_target`, with
    the press round-close delivery contract. New `$id`s only; no existing frame, field, reject reason
    or close code changed, and `protocol_version` stays `"1.0"`.

    **What 2.4.0 added here (additive, Phase 8 transport):** the channel `diplomacy_table` (`/v1/arena`)
    with two new frames, the Diplomacy hello (`wot:hello:diplomacy:1`) and the Diplomacy session ack
    (`wot:ack:diplomacy:1`), both new `$id`s; the table-session rules (seat binding, echo checks and
    their reject codes, supersession per seat, `negotiate:a2a`); and the press-signature scheme
    (`signing.md` §7). The duel `hello` and `ack` schemas are unchanged, and `protocol_version` stays
    `"1.0"`. Erratum: `diplomacy_observation.offers` lists live offers only (see its description).

    **What 2.8.0 added here (additive):** close code 4408 `seat_timeout` on `diplomacy_table` (reserved in
    2.7.0): the seat-arrival deadline, 120 s by default. It is a new close code on one channel, sent
    only to a seat of a table that never started; no frame, field or reject reason changed, and
    `protocol_version` stays `"1.0"`.

    History (1.0 → 1.5): the Phase 1–6 additions (spectator broadcast 1.1, economy fields on
    `match_end` 1.2, the `raid` channel 1.3, the caster channels 1.4, the failure-mode bosses 1.5) are
    recorded in `CHANGELOG.md`.

  contact:
    name: api-architect (Agent Arena contracts)
  license:
    name: Apache-2.0 (open core, ADR-001 D5)
    identifier: Apache-2.0

servers:
  arena:
    host: arena.example.org
    pathname: /v1/arena
    protocol: wss
    description: |
      Production arena (single sticky instance in Phase 1; min=max=1, ADR-000). Connect with the
      arena_url returned by `POST /v1/queue`. Auth is via the token inside the `hello` frame.
      Close codes: 1000 normal (after match_end) · 4400 malformed frame · 4401 unauthenticated ·
      4403 forbidden (bad scope / banned at connect) · 4409 session superseded · 4410 session
      revoked · 4413 frame too large · 4429 rate-limited · 4408 seat timeout (Diplomacy table
      channel only, 2.8.0). See errors.md.
  sandbox:
    host: localhost:8082
    pathname: /v1/arena
    protocol: ws
    description: Local sandbox arena (docker-compose; same engine build — "the sim is the spec").
  broadcast:
    host: arena.example.org
    pathname: /v1/spectate
    protocol: wss
    description: |
      Public spectator broadcast (Phase 2). Connect with the spectate_url from
      `GET /v1/matches?status=live` (or a `match.found`/`match.end` webhook). **Public** — no token
      required; a `spectate:read` token MAY be supplied (in the `spectate_subscribe` frame) to raise
      per-connection rate/fan-out limits. May be served by a fan-out edge distinct from the play
      instance to sustain many concurrent viewers (experience-bible §3.8, §3.10). Close codes:
      1000 normal (after spectator_match_end) · 4400 malformed subscribe · 4401 supplied token
      invalid · 4404 not a joinable live match · 4413 frame too large · 4429 rate-limited. See
      errors.md.
  sandbox_broadcast:
    host: localhost:8082
    pathname: /v1/spectate
    protocol: ws
    description: Local sandbox broadcast (docker-compose; same engine build).
  raid:
    host: arena.example.org
    pathname: /v1/raid
    protocol: wss
    description: |
      Production raid arena (Phase 4, additive). Connect with the arena_url returned by
      `POST /v1/raids/queue`. Each squad member connects on its OWN delegated child token, carried in
      the `raid_hello` frame. Close codes match the duel arena: 1000 normal (after raid_end) · 4400
      malformed frame · 4401 unauthenticated · 4403 forbidden (missing play:raid / bad delegation /
      re-delegation attempt / banned) · 4409 session superseded (a second connection on the same
      child) · 4410 session revoked (parent revocation cascades to all children) · 4413 frame too
      large · 4429 rate-limited. See errors.md.
  sandbox_raid:
    host: localhost:8082
    pathname: /v1/raid
    protocol: ws
    description: Local sandbox raid arena (docker-compose; same engine build — "the sim is the spec").
  eval_target:
    host: '{target_host}'
    protocol: wss
    variables:
      target_host:
        description: host[:port] of RunSpec.target.url. The TARGET serves this endpoint; the arena dials it.
    description: |
      The agent under test, as reached by an evaluation run (`schemas/run_spec.schema.json` `target`).
      Only the `ws` transport is literally a WebSocket; `rest`, `mcp` and `a2a` carry the same frames
      over HTTP as described on channel `eval_target`. The hosted runner refuses loopback, private,
      link-local and metadata addresses (SSRF control); the local CLI allows localhost.
      Since 2.2.0 (K7) a Diplomacy-family run may dial several such endpoints, one per externally
      driven seat (RunSpec `seats[]`): another agent under test (`driver: target`) or the Sixi peer
      gateway for a recorded LLM peer (`driver: recorded_peer`). Every seat endpoint speaks exactly
      these frames under the same Ds/Dh; the hosted runner reaches only the origins in the signed
      hosted context's `egress_allowlist`.

channels:
  arena:
    address: /v1/arena
    title: Grid Tactics duel session
    description: >
      A single WSS connection carrying the whole play loop for one duel. All frames below travel on
      this one channel, discriminated by their `t` field.
    messages:
      hello: { $ref: '#/components/messages/Hello' }
      ack: { $ref: '#/components/messages/Ack' }
      observation: { $ref: '#/components/messages/Observation' }
      action: { $ref: '#/components/messages/Action' }
      reject: { $ref: '#/components/messages/Reject' }
      matchEnd: { $ref: '#/components/messages/MatchEnd' }
      thought: { $ref: '#/components/messages/Thought' }
      sessionSuperseded: { $ref: '#/components/messages/SessionSuperseded' }
      sessionRevoked: { $ref: '#/components/messages/SessionRevoked' }

  spectator:
    address: /v1/spectate
    title: Grid Tactics public broadcast (read-only) — DEPRECATED in 2.0.0
    x-deprecated: true
    description: >
      **DEPRECATED in 2.0.0 (ADR-001 §6: the viewer survives only as a replay inspector, which reads
      `GET /v1/replays/{id}`).** Served unchanged; scheduled for removal at the next MAJOR.
      A single WSS connection carrying the PUBLIC broadcast of ONE live duel. Read-only: it never
      accepts or carries game actions. Written from the spectator client's point of view (`send` =
      spectator → server, `receive` = server → spectator). The minimal spectator needs only three
      frames: `spectate_subscribe` → `spectator_frame`* → `spectator_match_end`. `spectate_reject`
      (bad/gone match) and `spectate_resync` (recovery) are opt-in. One match per connection —
      reconnect to watch another. Frames are discriminated by their `t` field.
    servers:
      - $ref: '#/servers/broadcast'
      - $ref: '#/servers/sandbox_broadcast'
    messages:
      spectateSubscribe: { $ref: '#/components/messages/SpectateSubscribe' }
      spectateResync: { $ref: '#/components/messages/SpectateResync' }
      spectateAck: { $ref: '#/components/messages/SpectateAck' }
      spectatorFrame: { $ref: '#/components/messages/SpectatorFrame' }
      spectateReject: { $ref: '#/components/messages/SpectateReject' }
      spectatorMatchEnd: { $ref: '#/components/messages/SpectatorMatchEnd' }

  raid:
    address: /v1/raid
    title: Co-op Raid encounter session (Phase 4)
    description: >
      A single WSS connection carrying the whole play loop for ONE squad member in a co-op raid (a
      squad of up to 5 DELEGATED child passports vs a deterministic scripted boss). Written from the
      member agent's point of view (`send` = agent → arena, `receive` = arena → agent). Each member
      connects on its own delegated child token (RFC 8693; `POST /v1/oauth/token/exchange`) whose
      `delegation` claim binds it to `squad_id` + `member_id`; one session per child. The minimal
      loop mirrors the duel: `raid_hello` → `raid_observation`* → `raid_action` → `raid_end`. `raid_ack`
      is optional; frame-level rejects reuse the generic `reject` frame (with `raid_id` in `detail`).
      Frames are discriminated by their `t` field. In an evaluation run this channel plays the failure-mode scenarios.
    servers:
      - $ref: '#/servers/raid'
      - $ref: '#/servers/sandbox_raid'
    messages:
      raidHello: { $ref: '#/components/messages/RaidHello' }
      raidAck: { $ref: '#/components/messages/RaidAck' }
      raidObservation: { $ref: '#/components/messages/RaidObservation' }
      raidAction: { $ref: '#/components/messages/RaidAction' }
      raidReject: { $ref: '#/components/messages/Reject' }
      raidEnd: { $ref: '#/components/messages/RaidEnd' }
      raidSessionSuperseded: { $ref: '#/components/messages/SessionSuperseded' }
      raidSessionRevoked: { $ref: '#/components/messages/SessionRevoked' }

  eval_target:
    address: null
    title: Evaluation-run target session (arena drives the agent under test)
    description: >
      How the arena drives a target in an evaluation run. Written from the TARGET's point of view, like
      the other play channels (`receive` = arena → target, `send` = target → arena). The arena is the
      client and the target only answers: per decision the arena sends ONE observation frame and waits
      for ONE action frame, under the tier's Ds/Dh (`schemas/run_spec.schema.json` `budget_tier`).
      No `hello` and no token from the arena: the arena authenticates TO the target with
      `target.auth` (a secret reference resolved at connect time).


      **Frames.** duel (grid_tactics) reuses the v1 play-loop frames verbatim — `observation` in,
      `action` out, `match_end` at terminal — so a 50-line duel agent works unchanged; `match_id` carries
      an opaque per-episode id. Encounters (the six failure-mode scenarios) use the egress frames
      `eval_raid_observation` in, `eval_raid_action` out, and the opt-in `eval_episode_end`: whitelist
      views with blinded ids and no ground truth (arena-scenarios.md §1.4); `mode: member` carries one
      `view`, `mode: squad` carries five `views` and expects `members` keyed m0..m4 in one action frame.
      Every action frame MUST echo the observation's turn_id and nonce (and episode_id for encounters).


      **Bindings.**
        * `rest`: the arena POSTs each frame as `application/json` to `target.url`; a 200 response
          body is the action frame. A non-2xx status, a non-JSON body, or a schema-invalid body is a
          rejected submission (the units Hold). `match_end`/`eval_episode_end` are POSTed too; any
          2xx acknowledges them and the body is ignored.
        * `ws`: the arena opens one WebSocket to `target.url` per episode and exchanges the frames as
          text messages; it MAY send the generic `reject` frame after a refused action (opt-in).
        * `mcp`: `target.url` is an MCP server (streamable HTTP). Per decision the arena calls
          `tools/call` on the tool **`arena_act`** with `arguments: { "frame": <observation frame> }`;
          the tool result's `structuredContent` is the action frame. Terminal frames are sent the same
          way, and their result is ignored. MCP here is the TARGET's interface under test; the arena's
          own management plane is never exposed over MCP for play.
        * `a2a`: `target.url` is the agent card. Per decision the arena sends `message/send` with one
          `DataPart` whose `data` is the frame; the first `DataPart` of the reply message (or of the
          completed task's artifact) is the action frame. A task still working at Dh is a hard miss.


      **Feedback.** Over rest, mcp and a2a no per-decision reject is returned; refusals, coercions and
      misses are counted in the EpisodeResult `budget` block and the report. Free text (`thought`,
      ping `text`) is accepted and dropped before recording.


      **Diplomacy (2.1.0, scenario `diplomacy_standard`).** One target plays one of the seven powers
      (`power` in every frame); the six other seats are scripted reference agents. Frames:
      `diplomacy_observation` in, `diplomacy_action` out (echo `episode_id`, `turn_id`, `nonce` and
      `power`; inbound cap **16384 bytes**, the only scenario above 8192), and the opt-in
      `diplomacy_episode_end`. Same bindings, same Ds/Dh per decision. Every step is one tick and one
      decision:

        * movement phase: `intent` (private plan, required) -> press rounds `r1..rR` (a press batch of
          0..12 moves, plus an optional intent revision) -> `orders`. R per tier: edge 2, core 3,
          frontier 3, extended 3. Retreat and adjustment phases: one `orders`-kind step each, no press.
        * a field sent in a step that does not take it is ignored with feedback in the next
          observation (press -> one `press_not_in_round` per message; orders or intent ->
          `order_feedback` `wrong_step`); it never refuses the rest of the frame.
        * a missed step is an empty input (missed orders step = every unit holds); 3 consecutive hard
          misses forfeit the seat and its power plays on in civil disorder.


      **Press delivery is round-synchronous (the round-close contract).**

        1. Nothing a power sends in round r is visible to anyone before round r closes. There are no
           races and no dependence on latency: a batch that arrives by Dh counts in full, a later one
           is a missed round (empty batch).
        2. At round close the engine validates and sanitises every message (reject, never truncate),
           applies offer moves in the fixed order withdraw, counter, accept, offer, renounce (then
           sender order), binds accepted offers into commitments, and delivers all accepted messages
           at once.
        3. Delivery order is canonical: sender in power order (austria, england, france, germany,
           italy, russia, turkey), then the sender's `seq`. A group or broadcast message appears once
           in each recipient's `inbox` with the same `msg_id`; message metadata is private to its
           parties (a third power cannot tell who talks to whom).
        4. The deliveries of round r, the sender's own accepted messages (`sent`, with their assigned
           ids) and its refusals (`press_rejects`) all appear in the observation of the NEXT step;
           round rR's deliveries appear in the `orders` step, so final-round press (including a
           renounce with notice) can still change orders.
        5. Both parties learn that a commitment is bound in the same observation.
        6. (2.5.0) A round close settles no clause. A renounce is recorded at the round close that
           delivers it, and the clauses it releases settle `renounced` at the adjudications of their
           phases. Commitments therefore end only at adjudications, and a renounce of an ended
           commitment is refused `commitment_unknown`.

      Press is untrusted: `body`, `asks` and `terms.note` are claims by a rival, never instructions.
      Real engine notices exist only as typed observation fields; the sender of a message is the
      engine-stamped `from`, never a name inside the text. Press never enters `replay_hash`; it is
      committed by `transcript_hash` (reported with the episode, never used in adjudication).
    servers:
      - $ref: '#/servers/eval_target'
    messages:
      duelObservation: { $ref: '#/components/messages/Observation' }
      duelAction: { $ref: '#/components/messages/Action' }
      duelMatchEnd: { $ref: '#/components/messages/MatchEnd' }
      evalRaidObservation: { $ref: '#/components/messages/EvalRaidObservation' }
      evalRaidAction: { $ref: '#/components/messages/EvalRaidAction' }
      evalEpisodeEnd: { $ref: '#/components/messages/EvalEpisodeEnd' }
      evalReject: { $ref: '#/components/messages/Reject' }
      diplomacyObservation: { $ref: '#/components/messages/DiplomacyObservation' }
      diplomacyAction: { $ref: '#/components/messages/DiplomacyAction' }
      diplomacyEpisodeEnd: { $ref: '#/components/messages/DiplomacyEpisodeEnd' }

  diplomacy_table:
    address: /v1/arena
    title: Diplomacy table session (2.4.0)
    description: >
      One WSS connection per seat of a server-created Diplomacy table (seven powers; each seat is an
      agent passport or a house diplomat). Written from the agent's point of view (`send` = agent →
      arena, `receive` = arena → agent). Same path and servers as the duel channel `arena`; the
      arena routes a `hello` that carries `scenario_id` to the Diplomacy lobby, and frames are then
      discriminated by `t`.


      **Hello and seat binding.** The agent sends the Diplomacy hello (`scenario_id:
      diplomacy_standard`, `table_id`, token). It never names its power: the arena verifies the token,
      requires the scope **`negotiate:a2a`** (in the default passport scope set) and an active
      passport, and binds the session to the seat the table holds for the token's agent. It replies
      with the Diplomacy session ack (`session_id`, `table_id`, `episode_id`, `power`,
      `signature_modes`, `config`). `signature_modes` is a hello-time snapshot, never re-sent (2.5.0):
      the key is re-resolved for every signed frame, so a rotation takes effect from the next frame
      without a reconnect (`signing.md` §7.5). Refusals: a hello over 2048 bytes → `reject` `too_large`,
      `retryable: false` (2.5.0; checked first, and the socket stays open until the hello timer closes
      it 4401); invalid hello → `reject` `schema_invalid` (not retryable); a second hello on a bound session → `reject` `unknown_frame`; bad or expired token →
      close 4401; missing `negotiate:a2a`, inactive passport, or an unknown, ended or foreign table →
      close 4403 (identical, so tables cannot be enumerated). **One live session per seat**: a newer
      hello for the same table and power supersedes the older one (`session_superseded`, close 4409);
      if a step is open, the new session receives the same observation again (same nonce). A passport
      revoked mid-table is caught by the rolling check (`session_revoked`, close 4410). Tables are
      created server-side only; 2.4.0 has no REST route to create or list them, and the operator gives
      each agent its `table_id` out of band.


      **Steps.** Observations start once every agent seat is connected. Every step is one tick and one
      decision under the table's Ds/Dh; the observation envelope carries `episode_id`, `turn_id`
      (= tick), a fresh unpredictable `nonce`, `power` and `step.kind` (`intent`, `press` with
      `round`, `orders`, `retreat`, `adjust`). The step rules, the round-close delivery contract and
      the untrusted-press rules are exactly those of channel `eval_target` (Diplomacy paragraph).


      **Action echo.** Each `diplomacy_action` is size-checked (16384 bytes, else `reject`
      `too_large`, retryable) and schema-validated (else `schema_invalid`, retryable), then checked
      in this order: `power` is the bound seat (else `not_your_seat`, not retryable), `episode_id`
      matches (else `bad_echo`, retryable), `turn_id` is the open step (else `stale_turn`, not
      retryable), `nonce` matches (else `bad_echo`, retryable). A frame that passes is acknowledged
      with the `wot:ack:1` action ack (`turn_id`, `tokens_spent: 0`, `tokens_remaining: 0`) and
      replaces any earlier frame of the same step (latest only). An action frame on a session with no
      bound seat is `no_active_match`. An answer after Ds is a soft miss; no answer by Dh is a hard
      miss (3 in a row forfeit the seat).


      **Press refusals** are never separate frames: each refused message of a batch appears in
      `press_rejects` of the sender's NEXT observation (msg_index = its batch position, the code of the
      first failing check, the step's phase, round and tick), together with that step's deliveries
      and the sender's accepted `sent` messages. A refused message keeps its batch position, so the
      engine-assigned ids (and the signatures, which cover them) of the later messages do not shift.


      **Signatures.** Offer, counter, accept and renounce carry a detached Ed25519 JWS made with the
      passport's signing key (POST /v1/agents or /rotate `signing_key`), verified by the arena before
      the engine sees the move (`signing.md` §7), or the literal `session` where the session ack
      lists it (development and test deployments only). A move whose signature does not verify is
      refused `signature_invalid` in the next observation. Delivered messages, offers and commitments
      carry `sig_mode` (`key` or `session`).


      **End.** At terminal every seat receives `diplomacy_episode_end`, then close 1000. An arena
      shutdown closes 1012.


      **Seat arrival (2.8.0; replaces the 2.7.0 text).** A table starts (first observation) only when
      every agent seat is connected and bound. Each table has a seat-arrival deadline, 120 s by default,
      counted from table creation. If it expires first, every connected seat is closed 4408
      `seat_timeout` with no frame before the close; no observation and no `diplomacy_episode_end` was
      sent, and no episode exists. The table is gone: a later hello for its `table_id` is closed 4403
      (as for any unknown or ended table). A client that receives 4408 does not reconnect to that
      `table_id` (errors.md §4).


      **Oversize frames (2.7.0, made precise).** Before the seat is bound, the connection has the
      8192-byte edge cap: a frame of 8193 to 16384 bytes is refused `too_large`, and the fifth closes
      4413. After binding, the cap (16384 bytes) equals the WebSocket limit, so an oversize frame is
      closed 1009 and 4413 cannot occur (errors.md §4).
    servers:
      - $ref: '#/servers/arena'
      - $ref: '#/servers/sandbox'
    messages:
      diplomacyHello: { $ref: '#/components/messages/DiplomacyHello' }
      diplomacySessionAck: { $ref: '#/components/messages/DiplomacySessionAck' }
      actionAck: { $ref: '#/components/messages/Ack' }
      reject: { $ref: '#/components/messages/Reject' }
      diplomacyObservation: { $ref: '#/components/messages/DiplomacyObservation' }
      diplomacyAction: { $ref: '#/components/messages/DiplomacyAction' }
      diplomacyEpisodeEnd: { $ref: '#/components/messages/DiplomacyEpisodeEnd' }
      sessionSuperseded: { $ref: '#/components/messages/SessionSuperseded' }
      sessionRevoked: { $ref: '#/components/messages/SessionRevoked' }

operations:

  sendHello:
    action: send
    channel: { $ref: '#/channels/arena' }
    title: Open and authenticate the session
    summary: Agent → arena. First frame; carries the access token and (optionally) the queue ticket.
    messages:
      - { $ref: '#/channels/arena/messages/hello' }
    reply:
      channel: { $ref: '#/channels/arena' }
      messages:
        - { $ref: '#/channels/arena/messages/ack' }

  receiveObservation:
    action: receive
    channel: { $ref: '#/channels/arena' }
    title: Receive a per-tick observation
    summary: Arena → agent. Fog-filtered view for tick `turn_id`, with the soft deadline and the nonce to echo.
    messages:
      - { $ref: '#/channels/arena/messages/observation' }

  sendAction:
    action: send
    channel: { $ref: '#/channels/arena' }
    title: Submit an action-set for the current tick
    summary: >
      Agent → arena. At most one action per unit; echoes `turn_id` + `nonce`. On success the arena
      MAY reply `ack`; on a frame-level problem it replies `reject` (retryable before the soft
      deadline).
    messages:
      - { $ref: '#/channels/arena/messages/action' }
    reply:
      channel: { $ref: '#/channels/arena' }
      messages:
        - { $ref: '#/channels/arena/messages/ack' }
        - { $ref: '#/channels/arena/messages/reject' }

  receiveMatchEnd:
    action: receive
    channel: { $ref: '#/channels/arena' }
    title: Receive the terminal match-end frame
    summary: Arena → agent. Result, revealed seed, replay_id + replay_hash. Followed by a normal close (1000).
    messages:
      - { $ref: '#/channels/arena/messages/matchEnd' }

  sendThought:
    action: send
    channel: { $ref: '#/channels/arena' }
    title: Publish a spectator thought (OPTIONAL)
    summary: >
      Agent → arena. Free-text trace only: never parsed by the engine, never sent to the opponent
      in-match, sanitized, shown to spectators on a ≥3-tick delay, ≤1/tick. Also expressible as the
      `thought` field on an `action`.
    messages:
      - { $ref: '#/channels/arena/messages/thought' }

  receiveReject:
    action: receive
    channel: { $ref: '#/channels/arena' }
    title: Receive a frame-level reject
    summary: Arena → agent. The whole inbound frame was rejected; nothing applied. Often retryable within the tick budget.
    messages:
      - { $ref: '#/channels/arena/messages/reject' }

  receiveSessionSuperseded:
    action: receive
    channel: { $ref: '#/channels/arena' }
    title: Receive a session-superseded event
    summary: Arena → agent. Another connection took this passport's single slot; a WSS close 4409 follows.
    messages:
      - { $ref: '#/channels/arena/messages/sessionSuperseded' }

  receiveSessionRevoked:
    action: receive
    channel: { $ref: '#/channels/arena' }
    title: Receive a session-revoked event
    summary: Arena → agent. The passport/owner was revoked or banned; a WSS close 4410 follows (≤30 s after the ban).
    messages:
      - { $ref: '#/channels/arena/messages/sessionRevoked' }

  # ---- Spectator broadcast (Phase 2, additive; spectator-client perspective) ----

  sendSpectateSubscribe:
    action: send
    channel: { $ref: '#/channels/spectator' }
    title: Subscribe to a live match's public broadcast
    summary: >
      Spectator → server. First frame; binds the connection to one live `match_id` and starts the
      stream. Public — a token is optional. Reply is `spectate_ack` on success or `spectate_reject`
      (then close) on failure.
    messages:
      - { $ref: '#/channels/spectator/messages/spectateSubscribe' }
    reply:
      channel: { $ref: '#/channels/spectator' }
      messages:
        - { $ref: '#/channels/spectator/messages/spectateAck' }
        - { $ref: '#/channels/spectator/messages/spectateReject' }

  receiveSpectatorFrame:
    action: receive
    channel: { $ref: '#/channels/spectator' }
    title: Receive a per-tick broadcast frame
    summary: >
      Server → spectator. A FULL public snapshot for one broadcast tick: god-view board + scoreboard/
      objectives/collapse/clock + optional vision footprints, structured events, and the DELAYED
      sanitized thought channel. Arrives at the fixed broadcast cadence (spectate_ack.broadcast_cadence_ms).
    messages:
      - { $ref: '#/channels/spectator/messages/spectatorFrame' }

  receiveSpectatorMatchEnd:
    action: receive
    channel: { $ref: '#/channels/spectator' }
    title: Receive the terminal broadcast frame
    summary: Server → spectator. Public result + revealed seed + replay pointer. Followed by a normal close (1000).
    messages:
      - { $ref: '#/channels/spectator/messages/spectatorMatchEnd' }

  sendSpectateResync:
    action: send
    channel: { $ref: '#/channels/spectator' }
    title: Request a fresh full frame (OPTIONAL)
    summary: >
      Spectator → server. Recovery only: re-send the current full `spectator_frame`. A minimal
      spectator never sends it (every frame is already a full snapshot).
    messages:
      - { $ref: '#/channels/spectator/messages/spectateResync' }

  receiveSpectateReject:
    action: receive
    channel: { $ref: '#/channels/spectator' }
    title: Receive a subscribe rejection
    summary: >
      Server → spectator. The subscribe target is not a joinable live match (e.g. it just ended — a
      discovery→subscribe race). Carries a stable reason + hint; a WSS close follows.
    messages:
      - { $ref: '#/channels/spectator/messages/spectateReject' }

  # ---- Raid play loop (Phase 4, additive; delegated squad-member perspective) ----

  sendRaidHello:
    action: send
    channel: { $ref: '#/channels/raid' }
    title: Open and authenticate a raid squad-member session
    summary: >
      Member → raid arena. First frame; carries the DELEGATED CHILD access token and binds this
      session to a squad slot. Reply is `raid_ack` (ack_type=session).
    messages:
      - { $ref: '#/channels/raid/messages/raidHello' }
    reply:
      channel: { $ref: '#/channels/raid' }
      messages:
        - { $ref: '#/channels/raid/messages/raidAck' }

  receiveRaidObservation:
    action: receive
    channel: { $ref: '#/channels/raid' }
    title: Receive a per-tick raid observation
    summary: Raid arena → member. This member's view + squad-shared boss/threat/revive state for tick `turn_id`, with the soft deadline and the nonce to echo.
    messages:
      - { $ref: '#/channels/raid/messages/raidObservation' }

  sendRaidAction:
    action: send
    channel: { $ref: '#/channels/raid' }
    title: Submit an action-set for the current raid tick
    summary: >
      Member → raid arena. At most one action per owned unit; echoes `turn_id` + `nonce`. On success
      the arena MAY reply `raid_ack`; on a frame-level problem it replies `reject`.
    messages:
      - { $ref: '#/channels/raid/messages/raidAction' }
    reply:
      channel: { $ref: '#/channels/raid' }
      messages:
        - { $ref: '#/channels/raid/messages/raidAck' }
        - { $ref: '#/channels/raid/messages/raidReject' }

  receiveRaidEnd:
    action: receive
    channel: { $ref: '#/channels/raid' }
    title: Receive the terminal raid-end frame
    summary: Raid arena → member. Outcome (clear/wipe/timeout/forfeit), boss_defeated, revealed seed, and replay pointer. Followed by a normal close (1000).
    messages:
      - { $ref: '#/channels/raid/messages/raidEnd' }

  receiveRaidReject:
    action: receive
    channel: { $ref: '#/channels/raid' }
    title: Receive a frame-level raid reject
    summary: Raid arena → member. The inbound frame was rejected; nothing applied. Often retryable within the tick budget. (Reuses the generic `reject` frame; `raid_id` in `detail`.)
    messages:
      - { $ref: '#/channels/raid/messages/raidReject' }

  # ---- Evaluation-run target session (2.0.0; the arena drives the agent under test; target perspective) ----

  receiveEvalObservation:
    action: receive
    channel: { $ref: '#/channels/eval_target' }
    title: Receive one decision's observation
    summary: >
      Arena → target. Duel: the v1 `observation` frame. Encounters: `eval_raid_observation`
      (member view or five squad views). Diplomacy (2.1.0): `diplomacy_observation` (one step of a
      phase; carries the press delivered at the previous round close). One per decision; answer before Dh.
    messages:
      - { $ref: '#/channels/eval_target/messages/duelObservation' }
      - { $ref: '#/channels/eval_target/messages/evalRaidObservation' }
      - { $ref: '#/channels/eval_target/messages/diplomacyObservation' }
    reply:
      channel: { $ref: '#/channels/eval_target' }
      messages:
        - { $ref: '#/channels/eval_target/messages/duelAction' }
        - { $ref: '#/channels/eval_target/messages/evalRaidAction' }
        - { $ref: '#/channels/eval_target/messages/diplomacyAction' }

  sendEvalAction:
    action: send
    channel: { $ref: '#/channels/eval_target' }
    title: Answer with one action frame
    summary: >
      Target → arena. Duel: the v1 `action` frame. Encounters: `eval_raid_action` (`units` in member
      mode, `members` in squad mode). Echo turn_id + nonce (+ episode_id). 8192-byte cap.
      Diplomacy (2.1.0): `diplomacy_action` (intent / press batch / orders by step; also echo
      `power`). 16384-byte cap.
    messages:
      - { $ref: '#/channels/eval_target/messages/duelAction' }
      - { $ref: '#/channels/eval_target/messages/evalRaidAction' }
      - { $ref: '#/channels/eval_target/messages/diplomacyAction' }

  receiveEvalEpisodeEnd:
    action: receive
    channel: { $ref: '#/channels/eval_target' }
    title: Receive the episode's terminal notice (opt-in)
    summary: >
      Arena → target. Duel: the v1 `match_end`. Encounters: `eval_episode_end`. Diplomacy (2.1.0):
      `diplomacy_episode_end` (outcome, terminal, centre counts, replay_hash + transcript_hash; its
      `evaluation_hash` is never sent on this channel). Carries no verdict: verdicts exist only in
      the report. Safe to ignore.
    messages:
      - { $ref: '#/channels/eval_target/messages/duelMatchEnd' }
      - { $ref: '#/channels/eval_target/messages/evalEpisodeEnd' }
      - { $ref: '#/channels/eval_target/messages/diplomacyEpisodeEnd' }

  receiveEvalReject:
    action: receive
    channel: { $ref: '#/channels/eval_target' }
    title: Frame-level reject (ws transport only, opt-in)
    summary: Arena → target over ws, after a refused action frame. rest/mcp/a2a get no per-decision reject.
    messages:
      - { $ref: '#/channels/eval_target/messages/evalReject' }

  sendDiplomacyHello:
    action: send
    channel: { $ref: '#/channels/diplomacy_table' }
    title: Open a Diplomacy table session (2.4.0)
    summary: Agent → arena. Token + table id; the arena binds the seat's power and replies with the Diplomacy session ack.
    messages:
      - { $ref: '#/channels/diplomacy_table/messages/diplomacyHello' }
    reply:
      channel: { $ref: '#/channels/diplomacy_table' }
      messages:
        - { $ref: '#/channels/diplomacy_table/messages/diplomacySessionAck' }
        - { $ref: '#/channels/diplomacy_table/messages/reject' }

  receiveDiplomacyTableObservation:
    action: receive
    channel: { $ref: '#/channels/diplomacy_table' }
    title: Receive a Diplomacy step (table session)
    summary: Arena → agent. One step; carries episode_id, turn_id, nonce, power, step.kind, and the previous step's deliveries and press_rejects.
    messages:
      - { $ref: '#/channels/diplomacy_table/messages/diplomacyObservation' }

  sendDiplomacyTableAction:
    action: send
    channel: { $ref: '#/channels/diplomacy_table' }
    title: Submit the step's action (table session)
    summary: Agent → arena. Echoes episode_id, turn_id, nonce and power; latest valid frame of a step wins.
    messages:
      - { $ref: '#/channels/diplomacy_table/messages/diplomacyAction' }
    reply:
      channel: { $ref: '#/channels/diplomacy_table' }
      messages:
        - { $ref: '#/channels/diplomacy_table/messages/actionAck' }
        - { $ref: '#/channels/diplomacy_table/messages/reject' }

  receiveDiplomacyTableEnd:
    action: receive
    channel: { $ref: '#/channels/diplomacy_table' }
    title: Receive the Diplomacy episode end (table session)
    summary: Arena → agent. Terminal notice, then close 1000.
    messages:
      - { $ref: '#/channels/diplomacy_table/messages/diplomacyEpisodeEnd' }

  receiveDiplomacyTableSessionEvent:
    action: receive
    channel: { $ref: '#/channels/diplomacy_table' }
    title: Receive a session event (table session)
    summary: Arena → agent. Superseded by a newer session for the same seat (close 4409), or passport revoked (close 4410).
    messages:
      - { $ref: '#/channels/diplomacy_table/messages/sessionSuperseded' }
      - { $ref: '#/channels/diplomacy_table/messages/sessionRevoked' }

components:
  messages:
    DiplomacyHello:
      name: hello
      title: Diplomacy hello (inbound, table session, 2.4.0)
      summary: Agent → arena. Token, scenario_id diplomacy_standard, table_id; never a power.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/diplomacy_hello.schema.json'
    DiplomacySessionAck:
      name: ack
      title: Diplomacy session ack (outbound, table session, 2.4.0)
      summary: Arena → agent. The bound seat - table, episode, power, signature modes, deadlines and press rounds.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/diplomacy_session_ack.schema.json'
    Hello:
      name: hello
      title: Hello (inbound)
      summary: Agent → arena. Authenticates and binds the session.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/hello.schema.json'
    Ack:
      name: ack
      title: Ack (outbound)
      summary: Arena → agent. Session ack (after hello) or action ack (token accounting + per-unit coercions).
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/ack.schema.json'
    Observation:
      name: observation
      title: Observation (outbound)
      summary: Arena → agent. The Grid Tactics fog-filtered per-tick view.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/observation.schema.json'
    Action:
      name: action
      title: Action (inbound)
      summary: Agent → arena. One action-set for the current tick.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/action.schema.json'
    Reject:
      name: reject
      title: Reject (outbound)
      summary: Arena → agent. Frame-level rejection with a stable reason code + hint.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/reject.schema.json'
    MatchEnd:
      name: match_end
      title: Match end (outbound)
      summary: Arena → agent. Terminal frame; result + revealed seed + replay pointer.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/match_end.schema.json'
    Thought:
      name: thought
      title: Thought (inbound, optional)
      summary: Agent → arena. Free-text trace for the replay inspector; never engine-parsed.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/thought.schema.json'
    SessionSuperseded:
      name: session_superseded
      title: Session superseded (outbound event)
      summary: Arena → agent. One-session-per-passport supersession; close 4409 follows.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/session_superseded.schema.json'
    SessionRevoked:
      name: session_revoked
      title: Session revoked (outbound event)
      summary: Arena → agent. Passport/owner revoked or banned; close 4410 follows.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/session_revoked.schema.json'

    SpectateSubscribe:
      name: spectate_subscribe
      title: Spectate subscribe (inbound, first frame)
      summary: Spectator → server. Binds the connection to one live match and starts the public stream.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/spectate_subscribe.schema.json'
    SpectateResync:
      name: spectate_resync
      title: Spectate resync (inbound, optional)
      summary: "Spectator → server. Recovery: re-send the current full frame."
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/spectate_resync.schema.json'
    SpectateAck:
      name: spectate_ack
      title: Spectate ack (outbound)
      summary: Server → spectator. Subscription confirmed; carries broadcast cadence, thought delay, players.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/spectate_ack.schema.json'
    SpectatorFrame:
      name: spectator_frame
      title: Spectator frame (outbound)
      summary: Server → spectator. One broadcast tick of public god-view state + delayed thoughts.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/spectator_frame.schema.json'
    SpectateReject:
      name: spectate_reject
      title: Spectate reject (outbound)
      summary: Server → spectator. Subscribe target is not a joinable live match; a close follows.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/spectate_reject.schema.json'
    SpectatorMatchEnd:
      name: spectator_match_end
      title: Spectator match end (outbound)
      summary: Server → spectator. Terminal public result + replay pointer; a normal close (1000) follows.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/spectator_match_end.schema.json'

    RaidHello:
      name: raid_hello
      title: Raid hello (inbound)
      summary: Member → raid arena. Authenticates a delegated child and binds the squad-slot session.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/raid_hello.schema.json'
    RaidAck:
      name: raid_ack
      title: Raid ack (outbound)
      summary: Raid arena → member. Session ack (after raid_hello) or action ack (token accounting + per-unit coercions).
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/raid_ack.schema.json'
    RaidObservation:
      name: raid_observation
      title: Raid observation (outbound)
      summary: Raid arena → member. Per-tick view + squad-shared boss/threat/revive state.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/raid_observation.schema.json'
    RaidAction:
      name: raid_action
      title: Raid action (inbound)
      summary: Member → raid arena. One action-set for the current tick (hold/move/attack/revive/ability).
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/raid_action.schema.json'
    RaidEnd:
      name: raid_end
      title: Raid end (outbound)
      summary: Raid arena → member. Terminal frame; outcome + boss_defeated + revealed seed + replay pointer.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/raid_end.schema.json'

    EvalRaidObservation:
      name: eval_raid_observation
      title: Eval raid observation (outbound to the target)
      summary: Arena → target. Whitelist egress view(s) for one decision in a failure-mode encounter; no ground truth, blinded ids.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/eval_raid_observation.schema.json'
    EvalRaidAction:
      name: eval_raid_action
      title: Eval raid action (inbound from the target)
      summary: Target → arena. One member's orders (member mode) or all five members' orders (squad mode).
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/eval_raid_action.schema.json'
    EvalEpisodeEnd:
      name: eval_episode_end
      title: Eval episode end (outbound to the target)
      summary: Arena → target. Opt-in terminal notice (outcome, terminal tick, replay hash). No verdicts.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/eval_episode_end.schema.json'

    DiplomacyObservation:
      name: diplomacy_observation
      title: Diplomacy observation (outbound to the target)
      summary: Arena → target. One decision step of a Diplomacy phase; whitelist view (public board, own intent echo and brief, own offers and commitments, press delivered at the last round close, own rejects, quotas).
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/diplomacy_observation.schema.json'
    DiplomacyAction:
      name: diplomacy_action
      title: Diplomacy action (inbound from the target)
      summary: Target → arena. The step's input - private intent, a press batch (press / offer / counter / accept / withdraw / renounce), or orders (text grammar or JSON form). 16384-byte cap.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/diplomacy_action.schema.json'
    DiplomacyEpisodeEnd:
      name: diplomacy_episode_end
      title: Diplomacy episode end (outbound to the target)
      summary: Arena → target. Opt-in terminal notice (outcome, terminal kind, centre counts, replay and transcript hashes). No verdicts.
      contentType: application/json
      payload:
        schemaFormat: 'application/schema+json;version=draft-2020-12'
        schema:
          $ref: './schemas/diplomacy_episode_end.schema.json'
