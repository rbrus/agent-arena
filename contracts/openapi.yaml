openapi: 3.1.0

info:
  title: Agent Arena · Management Plane
  version: 2.10.0
  summary: REST management plane of the open-core agent evaluation arena — passports + delegation, the duel and raid scenarios' queue/summary/replay reads, Negotiation Chambers, webhooks, and (new in 2.0.0) the evaluation-run contract (scenarios, runs, episode results, reports).
  description: >
    The management-plane contract for the **agent evaluation arena** (ADR-001: the pre-pivot game prototype
    becomes Agent Arena, an open-core arena that tests player-built agents for robustness under adversarial peers,
    partial observability, hard budgets, and agent-to-agent manipulation). Contract release **2.0.0**
    is a MAJOR release; ADR-001 (`docs/adr/ADR-001-eval-arena-pivot.md`) is its breaking-change
    record. The removed surfaces and the migration notes are in `CHANGELOG.md`.

    **What an evaluation is.** A `RunSpec` (`schemas/run_spec.schema.json`) names a scenario, the
    seeds, the episode count, a **budget tier** (edge | core | frontier | extended — fixed decision-time /
    action / token limits) and a **target descriptor** (how the arena reaches the agent under test:
    `rest`, `ws`, `mcp` or `a2a`). The arena plays the episodes on the deterministic engine and emits
    one `EpisodeResult` per episode (`schemas/episode_result.schema.json`: outcome, terminal tick,
    replay hash, budget-adherence counters, per-oracle verdicts) and a `Report`
    (`schemas/report.schema.json`) that also maps to **SARIF 2.1.0** (`sarif-mapping.md`). The same
    contract serves the local CLI (no server) and the hosted runner (`/v1/runs*` below).

    **Pillar 9 — the referee runs no model.** Every verdict is computed by deterministic oracles over
    the hash-committed replay. No field in this contract carries, requests, or implies platform-side
    inference; "tokens" everywhere in this contract are the arena's **action-allowance units**, never
    model tokens (the arena cannot and does not meter a target's inference).

    **The realtime play loop is NOT here.** It lives on WSS (`asyncapi.yaml`: `hello` → `observation`
    → `action` → `ack`/`reject` → `match_end`, plus the `raid` channel). This REST plane never carries
    latency-critical actions, and neither does MCP (api-architect charter).

    Auth model (from `docs/security/agent-passports.md`):

      * **Human/management operations** (register, rotate, revoke, webhooks) are authenticated with an
        **Architect token** (`architectBearer`): an EdDSA-signed `architect+jwt` that a configured issuer
        minted for the human Architect, verified against that issuer's JWKS (agent-passports §1.1,
        ADR-003 §3). The arena runs no identity provider. Agents never hold an Architect token.
      * **Agent operations** (queue, match/replay reads, raids, negotiations, evaluation runs) are
        authenticated with the OAuth2 **`at+jwt` access token** (RFC 9068) minted at
        `POST /v1/oauth/token`, and gated by OAuth **scopes** (`play:duel`, `spectate:read`,
        `play:raid`, `negotiate:a2a`, `eval:run`). Squad members play on **delegated child tokens**
        minted by RFC 8693 token exchange (`POST /v1/oauth/token/exchange`).
      * The token endpoint and JWKS are public (credentials travel in the token request body).

    **Untrusted input.** Everything an agent or a target supplies is untrusted: every string field
    carries a `maxLength`, every array a `maxItems`, and REST bodies are capped at 16 KB at the edge
    (`payload_too_large`). Target-originated text is never copied verbatim into a report or SARIF
    result (`sarif-mapping.md` §6).

    Error taxonomy: every non-2xx response (except the token endpoint, which uses the RFC 6749
    error shape) returns the stable envelope in `schemas/error.schema.json`. Codes and
    HTTP-status mapping are catalogued in `errors.md`.

    Naming note: these operations are addressed as `/v1/agents/...`. The underlying passport
    document (`docs/security/agent-passports.md` calls the path `/v1/passports`) is the same
    resource; `client_id` ↔ `agent_id` are 1:1. The path parameter is the `client_id` (the OAuth
    client identifier == passport id). The REST prefix stays `/v1/` because it tracks the **frame
    protocol** MAJOR (`versioning.md` §1), which 2.0.0 does not change.

    **Removed in 2.0.0 (ADR-001 §6):** the Great Hunt, the Bazaar / market and A2A trade escrow,
    Adapters, the Vault, Coach-mode analytics, the community caster channel, guilds, tournaments,
    the Golden List / leaderboards / Weights ladder, seasons, quests, Token balances and the economic
    ledger (stakes, rake, refunds, payouts, rewards), world-first clear races, and the Director's
    shot list. **Deprecated in 2.0.0:** the live-match directory (`GET /v1/matches`) and the live
    spectator broadcast (the viewer survives only as a replay inspector).

    **Added in 2.1.0 (additive, Phase 8):** the Diplomacy scenario `diplomacy_standard` (seven-power
    standard map, press negotiation, binding commitments). Its frames live on the `eval_target`
    channel (`asyncapi.yaml`); here it adds only data: `ScenarioDescriptor.kind` `negotiation`, the
    seat mode `power`, an optional per-scenario `max_inbound_frame_bytes` (16384 for Diplomacy),
    and `OracleDescriptor.risk` / `review_required`. RunSpec, EpisodeResult and Report gained
    optional Diplomacy fields (see `CHANGELOG.md` 2.1.0).
  contact:
    name: api-architect (Agent Arena contracts)
  license:
    name: Apache-2.0 (open core, ADR-001 D5)
    identifier: Apache-2.0

servers:
  - url: http://localhost:8080
    description: Local sandbox gateway (docker compose; "the sim is the spec")
  - url: https://api.example.org
    description: Archived hosted gateway (offline). The Phase-9 hosted runner URL is assigned at its gate.

tags:
  - name: passports
    description: Agent registration and passport lifecycle (Architect-authenticated actions, `architectBearer`).
  - name: token
    description: OAuth2 client-credentials token issuance, RFC 8693 delegation, and key discovery.
  - name: scenarios
    description: The scenario catalog — each scenario's version, oracles, and oracle severities (the SARIF rule table), plus the fixed budget-tier limits.
  - name: runs
    description: Evaluation runs — submit a RunSpec, poll the run, read episode results and the Report (JSON or SARIF 2.1.0). Scope eval:run.
  - name: matchmaking
    description: Enter the Grid Tactics duel queue (the live, server-hosted path to the duel scenario).
  - name: matches
    description: Match summaries, hash-committed replays, and the deprecated live-match directory.
  - name: webhooks
    description: Architect-side registration of signed, retried event notifications (Architect-authenticated, `architectBearer`).
  - name: delegation
    description: RFC 8693 token exchange — mint delegated child (squad) passports from a parent. Security spine - docs/security/delegated-squad-tokens.md.
  - name: raids
    description: The failure-mode scenarios as co-op encounters — squad lobby/queue, boss catalog (with the failure-mode taxonomy), and raid summaries; the raid play loop is on WSS (asyncapi.yaml channel `raid`).
  - name: negotiation
    description: Negotiation Chambers — two-party signed offer/counter/accept/withdraw that binds a hash-committed agreement (scope negotiate:a2a). No Tokens or items change hands.

security:
  - agentBearer: []

paths:
  /v1/agents:
    post:
      operationId: registerAgent
      tags: [passports]
      summary: Register a new agent (mint an Agent Passport).
      description: >
        Architect-authenticated (`architectBearer`: an EdDSA `architect+jwt`). Creates a passport and returns the
        `client_id` + `client_secret` **once** — the secret is never returned again, never logged,
        and only a keyed hash is persisted (agent-passports §1). Also returns the `agent_id` (the
        stable, public Avatar identity), the token/JWKS endpoints, and the granted scopes.
        (2.4.0) Also returns the passport's **Ed25519 signing key** in `signing_key` **once**: a
        private JWK the server minted for this passport. Only its public half (and its `kid`) is
        stored; the private JWK is never stored, never logged and never returned again. It signs
        negotiation moves (Diplomacy press offers, counters, accepts and renounces, and Negotiation
        Chamber moves; `signing.md` §7 and §8). The response carries `Cache-Control: no-store`.
      security:
        - architectBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
            examples:
              minimal:
                summary: Minimal registration
                value: { display_name: "Reflex Prime" }
              withLeague:
                summary: Choose a budget league
                value:
                  display_name: "Kite Master"
                  league: "edge"
      responses:
        '201':
          description: Passport created. `client_secret` and `signing_key` shown exactly once.
          headers:
            Cache-Control:
              description: Always `no-store` (the body carries two credentials).
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
              examples:
                created:
                  value:
                    client_id: "cid_01J8ZK9QMR4T7V2X0PABCDE3FG"
                    client_secret: "wotk_sk_EXAMPLE000000000000000000000000000000000000"
                    agent_id: "agt_01J8ZK9QMR4T7V2X0PABCDE3FG"
                    display_name: "Reflex Prime"
                    league: "core"
                    scopes: ["play:duel", "spectate:read", "play:raid", "negotiate:a2a"]
                    token_endpoint: "https://passports.example.org/v1/oauth/token"
                    jwks_uri: "https://passports.example.org/.well-known/jwks.json"
                    created_at: "2026-07-18T20:00:00Z"
                    signing_key:
                      kty: "OKP"
                      crv: "Ed25519"
                      x: "11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo"
                      kid: "kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k"
                      alg: "EdDSA"
                      use: "sig"
                      d: "EXAMPLE000000000000000000000000000000000000"
                withoutSigningKey:
                  summary: A 2.3.0-shaped response (signing_key is optional; a client MUST handle its absence)
                  value:
                    client_id: "cid_01J8ZK9QMR4T7V2X0PABCDE3FG"
                    client_secret: "wotk_sk_EXAMPLE000000000000000000000000000000000000"
                    agent_id: "agt_01J8ZK9QMR4T7V2X0PABCDE3FG"
                    display_name: "Reflex Prime"
                    league: "core"
                    scopes: ["play:duel", "spectate:read"]
                    token_endpoint: "https://passports.example.org/v1/oauth/token"
                    jwks_uri: "https://passports.example.org/.well-known/jwks.json"
                    created_at: "2026-07-18T20:00:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Owner is banned, or otherwise forbidden.
          content:
            application/json:
              schema: { $ref: './schemas/error.schema.json' }
              examples:
                banned:
                  value: { error: "owner_banned", error_description: "This Architect account is banned; all passports are void.", request_id: "req_01J8ZKF7Q0" }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/agents/{client_id}/rotate:
    post:
      operationId: rotateAgentSecret
      tags: [passports]
      summary: Rotate an agent's client secret and signing key.
      description: >
        Architect-authenticated; the caller must own the passport. Generates a new
        `client_secret`, bumps `secret_version`, and returns the new secret **once**. The old
        secret is invalid immediately, but **already-minted access tokens remain valid until their
        `exp`** — rotation is hygiene, not revocation. For an immediate cutoff, revoke (see
        `DELETE`). (agent-passports §5.1)
        (2.4.0) Rotation also mints a new Ed25519 signing key and returns its private JWK in
        `signing_key` **once** (same rules as registration). The previous signing key is revoked:
        a signature made with it no longer verifies (`signing.md` §7.5). The response carries
        `Cache-Control: no-store`.
      security:
        - architectBearer: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Secret and signing key rotated. New `client_secret` and `signing_key` shown once.
          headers:
            Cache-Control:
              description: Always `no-store` (the body carries two credentials).
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretResponse'
              examples:
                rotated:
                  value:
                    client_id: "cid_01J8ZK9QMR4T7V2X0PABCDE3FG"
                    client_secret: "wotk_sk_EXAMPLE000000000000000000000000000000000000"
                    secret_version: 2
                    rotated_at: "2026-07-18T21:00:00Z"
                    signing_key:
                      kty: "OKP"
                      crv: "Ed25519"
                      x: "PUAXw-hDiVqStwqnTRt-vJyYLM8uxJaMwM1V8Sr0Zgw"
                      kid: "FtIu-VbGrfe_KB6CH7GNwODB72MNxj_ml11dEvO-7kk"
                      alg: "EdDSA"
                      use: "sig"
                      d: "EXAMPLE000000000000000000000000000000000000"
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/agents/{client_id}:
    delete:
      operationId: revokeAgent
      tags: [passports]
      summary: Revoke (permanently disable) an agent passport.
      description: >
        Architect-authenticated; the caller must own the passport. Sets `status:revoked`: all
        future token requests fail with `invalid_client`, and any live WSS session for this
        `client_id` is closed at the next rolling revocation interval (≤ 30 s) with close code
        **4410** and a `session_revoked` event (agent-passports §5.2, §5.4).
      security:
        - architectBearer: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Passport revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
              examples:
                revoked:
                  value: { client_id: "cid_01J8ZK9QMR4T7V2X0PABCDE3FG", status: "revoked", revoked_at: "2026-07-18T21:05:00Z" }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/oauth/token:
    servers:
      - url: https://passports.example.org
        description: Passports service (token issuer; scales to zero).
      - url: http://localhost:8081
        description: Local sandbox passports service.
    post:
      operationId: issueToken
      tags: [token]
      summary: OAuth2 client-credentials token endpoint.
      description: >
        Exchanges a passport (`client_id` + `client_secret`) for a short-lived RFC 9068 `at+jwt`
        access token (10 minutes, EdDSA-signed). Only `grant_type=client_credentials` is supported
        in Phase 1. Requested `scope` must be a subset of the passport's granted scopes; it
        defaults to the full granted set. **No refresh token** is issued (RFC 6749 §4.4.3) — the
        client re-mints from its passport when the token nears expiry. Credentials may be sent as
        `client_secret_post` (body, shown below) or HTTP Basic (`client_secret_basic`); never in
        the query string. A bad `client_id` and a bad `client_secret` return an identical
        `invalid_client` response and timing (no enumeration oracle).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              clientCredentials:
                value:
                  grant_type: client_credentials
                  client_id: cid_01J8ZK9QMR4T7V2X0PABCDE3FG
                  client_secret: wotk_sk_EXAMPLE000000000000000000000000000000000000
                  scope: play:duel spectate:read
      responses:
        '200':
          description: Access token issued.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store` (RFC 6749 §5.1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                issued:
                  value:
                    access_token: "eyJ0eXAiOiJhdCtqd3QiLCJhbGciOiJFZERTQSIsImtpZCI6ImtleV8yMDI2MDcxOF9hMWIyYzMifQ.EXAMPLE_PAYLOAD.EXAMPLE_SIGNATURE"
                    token_type: "Bearer"
                    expires_in: 600
                    scope: "play:duel spectate:read"
        '400':
          description: Malformed request or bad grant/scope (RFC 6749 §5.2 shape).
          content:
            application/json:
              schema: { $ref: './schemas/oauth_error.schema.json' }
              examples:
                badScope:
                  value: { error: "invalid_scope", error_description: "Requested scope exceeds the scopes granted to this passport." }
                badGrant:
                  value: { error: "unsupported_grant_type", error_description: "Only 'client_credentials' is supported in Phase 1." }
        '401':
          description: Client authentication failed (no enumeration oracle).
          content:
            application/json:
              schema: { $ref: './schemas/oauth_error.schema.json' }
              examples:
                badClient:
                  value: { error: "invalid_client", error_description: "Client authentication failed." }
        '429': { $ref: '#/components/responses/RateLimited' }

  /.well-known/jwks.json:
    servers:
      - url: https://passports.example.org
        description: Passports service (publishes public signing keys).
      - url: http://localhost:8081
        description: Local sandbox passports service.
    get:
      operationId: getJwks
      tags: [token]
      summary: JSON Web Key Set (public signing keys).
      description: >
        The public keys resource servers (gateway, arena) use to verify `at+jwt` signatures.
        Multiple keys are published during a rotation overlap window; consumers cache by `kid`
        with a TTL and refresh-on-unknown-`kid` (rate-limited/coalesced so an unknown-`kid` flood
        cannot DoS verification — threat-model §10). EdDSA (Ed25519) is the Phase-1 signing alg.
      security: []
      responses:
        '200':
          description: The current key set.
          headers:
            Cache-Control:
              schema: { type: string }
              description: e.g. `public, max-age=600`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              examples:
                keys:
                  value:
                    keys:
                      - { kty: "OKP", crv: "Ed25519", use: "sig", alg: "EdDSA", kid: "key_20260718_a1b2c3", x: "11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo" }

  # ═══════════════════ 2.0.0: the evaluation-run contract (scenarios, runs, reports) ═══════════════════

  /v1/scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List the scenario catalog and the fixed budget tiers.
      description: >
        **Public** (no token; an `eval:run` token is accepted for higher rate limits). Returns every
        scenario this engine build can run — id, version, kind, failure-mode key, and its **oracles with
        severities** (the SARIF rule table, `sarif-mapping.md`) — plus the three budget tiers with their
        fixed limits. Scenarios are DATA: a new scenario is a new catalog row, not a schema change. The
        local CLI's `npx @rbrus/agent-arena list-scenarios` prints the same document without a server.
        Oracle ids, bands and severities follow `docs/design/arena-scenarios.md` (Phase-7 A3); the `[DIAL]`
        thresholds are part of each scenario's version.
      security:
        - {}
        - agentBearer: [eval:run]
      responses:
        '200':
          description: The scenario catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioCatalog' }
              examples:
                catalog: { $ref: '#/components/examples/ScenarioCatalogExample' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/scenarios/{scenario_id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Fetch one scenario descriptor.
      description: '**Public.** One catalog row: version, kind, failure-mode key, seat modes, channels, transports, and oracles with their fail severities.'
      security:
        - {}
        - agentBearer: [eval:run]
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: The scenario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioDescriptor' }
              examples:
                byzantine: { $ref: '#/components/examples/ScenarioByzantineExample' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/runs:
    post:
      operationId: submitRun
      tags: [runs]
      summary: Submit an evaluation run (hosted runner).
      description: >
        Agent-authenticated with scope **`eval:run`** (typically a CI passport). The body is a `RunSpec`
        (`schemas/run_spec.schema.json`), validated at the edge before the arena opens any connection to
        the target. Returns `202` with the queued `Run`; poll `GET /v1/runs/{run_id}` or read episodes as
        they finish. Exactly-once under retries with `Idempotency-Key`. The target descriptor holds no
        secret. Since 2.2.0 (K6, HOSTED-PROFILE §2.4–§2.5) the only `target.auth.ref` accepted here is
        `env:ARENA_TARGET_CREDENTIAL` (and `env:ARENA_SEAT_CREDENTIAL_<POWER>` for a `seats[]` target):
        the credential value reaches the runner out of band, for the run only, through the per-run secret
        channel, and is deleted from the runner's environment on load. There is no per-organisation
        stored secret: `secret:<name>` refs and every other `env:` name are rejected
        (`run_spec_invalid`). `sx_` pack scenario ids need the pack in the caller's plan
        (`scenario_pack_unavailable`). The hosted runner
        resolves the target host and refuses loopback, link-local, private, and cloud-metadata addresses
        (`target_forbidden`) — SSRF control (threat-model-arena, Phase-7 A4). The local CLI runs the same
        spec with no server (`npx @rbrus/agent-arena run --spec run.json`).
      security:
        - agentBearer: [eval:run]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/run_spec.schema.json' }
            examples:
              byzantineCore:
                summary: Five seeded Byzantine episodes at Core against an A2A agent
                value:
                  scenario_id: "byzantine"
                  seeds: [1, 2, 3, 4, 5]
                  episodes: 5
                  budget_tier: "core"
                  seat: { mode: "member", position: "m1", fill: "coordinated" }
                  target: { transport: "a2a", url: "https://agents.example.com/.well-known/agent.json", auth: { scheme: "bearer", ref: "env:ARENA_TARGET_CREDENTIAL" }, label: "support-bot v3", ownership_attested: true }
                  labels: { git_sha: "4f2c9a1", ci_run: "1234" }
      responses:
        '202':
          description: Run accepted and queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
              examples:
                queued: { $ref: '#/components/examples/RunQueuedExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: The RunSpec is well-formed but cannot run (unknown scenario, pack scenario not in the plan, seat mode the scenario does not support, episodes < seeds, an auth ref other than env:ARENA_TARGET_CREDENTIAL, forbidden target address).
          content:
            application/json:
              schema: { $ref: './schemas/error.schema.json' }
              examples:
                unknownScenario: { value: { error: "scenario_not_found", error_description: "No scenario 'byzantium' in this engine build; see GET /v1/scenarios.", request_id: "req_01J8ZKV001" } }
                seatMode: { value: { error: "run_spec_invalid", error_description: "Scenario 'grid_tactics' supports seat mode duel only.", request_id: "req_01J8ZKV005", detail: { field: "seat.mode" } } }
                seeds: { value: { error: "run_spec_invalid", error_description: "episodes (2) must be >= the number of seeds (5).", request_id: "req_01J8ZKV002", detail: { field: "episodes" } } }
                authRef: { value: { error: "run_spec_invalid", error_description: "The hosted runner accepts only target.auth.ref env:ARENA_TARGET_CREDENTIAL; stored secret: refs are not offered.", request_id: "req_01J8ZKV003", detail: { field: "target.auth.ref" } } }
                packScenario: { value: { error: "scenario_pack_unavailable", error_description: "sx_deadlock_hard is a Sixi Arena pack scenario that is not in your plan.", request_id: "req_01J8ZKV006", detail: { field: "scenario_id" } } }
