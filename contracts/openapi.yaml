                      reason: "ascension"
                      final_scores: { A: 100, B: 71 }
                      tokens_remaining: { A: 88, B: 0 }
                      ticks_played: 73
                    replay_hash: "sha256:9f2c1b7e4a6d8035f1c2b3a4d5e6f7089a0b1c2d3e4f5061728394a5b6c7d8e9"
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/ReplayNotFound' }
