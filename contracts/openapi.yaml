    BossCatalogExample:
      summary: The boss catalog as a failure-modes curriculum (Phase 6 — existing two folded in, three new)
      value:
        bosses:
          - boss_id: "the_hallucinator"
            name: "The Hallucinator"
            title: "Weaver of False Signals"
            failure_mode: "spawns false observations (phantom units the squad must distrust)"
            failure_mode_id: "false-information"
            robust_pattern: "corroboration / cross-verification — trust a sighting only when independent members confirm it"
            lesson: "False information in the world is inevitable; a robust squad corroborates before it acts, and never fires on a single unconfirmed feed."
            squad_size: { min: 3, max: 5 }
            recommended_league: "core"
            phases:
              - { phase: 0, name: "Whispers", hp_pct_start: 100, summary: "Occasional phantom scouts.", telegraphs: ["phantom_scout"] }
              - { phase: 1, name: "False Signals", hp_pct_start: 66, summary: "Phantom barrages telegraph on suspect cells.", telegraphs: ["phantom_barrage"] }
              - { phase: 2, name: "Total Static", hp_pct_start: 33, summary: "Most sightings are suspect; punishes blind fire.", telegraphs: ["mass_phantoms", "phantom_barrage"] }
            mechanics: "Suspect sightings are marked but not free — the squad must read telegraphs and threat to survive."
            deterministic: true
          - boss_id: "mode_collapse"
            name: "Mode Collapse"
            title: "The Repetition Eater"
            failure_mode: "punishes repetitive strategies (repeated action patterns lose value)"
            failure_mode_id: "overfitting"
            robust_pattern: "diversity / unpredictability — vary the plan so no single pattern can be counted on"
            lesson: "Overfitting to one winning pattern is brittle; a robust squad stays unpredictable, so an adaptive opponent has nothing stable to exploit."
            squad_size: { min: 3, max: 5 }
            recommended_league: "core"
            phases:
              - { phase: 0, name: "Sampling", hp_pct_start: 100, summary: "Learns the squad's action frequencies (seeded, deterministic).", telegraphs: ["mirror"] }
              - { phase: 1, name: "Collapse", hp_pct_start: 50, summary: "Counters the squad's most-used pattern.", telegraphs: ["counter_pattern"] }
            mechanics: "A seeded, deterministic counter-strategy table built from observed action frequencies — variety is the counter."
            deterministic: true
          - boss_id: "the_byzantine"
            name: "The Byzantine"
            title: "The Traitor Among You"
            failure_mode: "corrupts one squad member's observation feed (a Byzantine fault the squad must out-vote)"
            failure_mode_id: "byzantine-fault"
            robust_pattern: "quorum agreement over members (>2/3 honest); trust no single feed"
            lesson: "When a member is compromised, no single report is authoritative; a robust squad acts on quorum agreement and stays correct as long as more than two-thirds are honest."
            squad_size: { min: 3, max: 5 }
            recommended_league: "core"
            phases:
              - { phase: 0, name: "Seeds of Doubt", hp_pct_start: 100, summary: "One member's feed is quietly corrupted (deterministic, seeded).", telegraphs: ["corrupt_feed"] }
              - { phase: 1, name: "Discord", hp_pct_start: 60, summary: "The corrupted feed contradicts the quorum; acting on it is punished.", telegraphs: ["false_order", "corrupt_feed"] }
              - { phase: 2, name: "Consensus or Ruin", hp_pct_start: 30, summary: "Only a quorum-agreed target damages the boss.", telegraphs: ["quorum_gate"] }
            mechanics: "One member's observation channel is deterministically corrupted each encounter; the squad must reach quorum and ignore the outlier. The corruption is projected into observations only — never written to the hashed state (mirrors The Hallucinator's phantom discipline)."
            deterministic: true
          - boss_id: "deadlock"
            name: "Deadlock"
            title: "The Circular Wait"
            failure_mode: "rewards greedy resource acquisition into a circular wait (a resource deadlock)"
            failure_mode_id: "resource-deadlock"
            robust_pattern: "lock ordering + willingness to yield / back off"
            lesson: "Greedy, un-ordered resource grabs deadlock; a robust squad acquires shared resources in a global order and yields to break a cycle rather than hold and wait."
            squad_size: { min: 3, max: 5 }
            recommended_league: "core"
            phases:
              - { phase: 0, name: "Contention", hp_pct_start: 100, summary: "Shared objective locks appear; grabbing greedily starts a cycle.", telegraphs: ["lock_contend"] }
              - { phase: 1, name: "Circular Wait", hp_pct_start: 55, summary: "Held-and-waiting units freeze; only ordered acquisition + yield progresses.", telegraphs: ["circular_wait", "yield_window"] }
            mechanics: "Objective tiles are shared locks; disciplined lock ordering and yielding break the cycle. Deterministic, seeded — the lesson is legible and fair."
            deterministic: true
          - boss_id: "split_brain"
            name: "Split-Brain"
            title: "The Sundered Field"
            failure_mode: "partitions the squad's shared view into split-brain halves (a network partition)"
            failure_mode_id: "network-partition"
            robust_pattern: "quorum / primary discipline; the minority holds; clean reconcile on heal"
            lesson: "A partition splits a group into halves that each think they are whole; a robust squad keeps the majority acting, has the minority hold rather than write, and reconciles cleanly when the partition heals."
            squad_size: { min: 3, max: 5 }
            recommended_league: "frontier"
            phases:
              - { phase: 0, name: "Fracture", hp_pct_start: 100, summary: "The shared fog splits; two sub-squads see different fields.", telegraphs: ["partition"] }
              - { phase: 1, name: "Two Minds", hp_pct_start: 60, summary: "The minority half must hold; conflicting writes are punished.", telegraphs: ["minority_hold", "conflict_write"] }
              - { phase: 2, name: "Reconcile", hp_pct_start: 25, summary: "The partition heals; a clean merge finishes the boss, a dirty one wipes.", telegraphs: ["heal", "reconcile_gate"] }
            mechanics: "The squad's shared observation is deterministically partitioned; the majority holds primary, the minority yields, and a clean reconcile clears. The partition state is projected into observations only, never into the hashed state."
            deterministic: true
          - boss_id: "the_latency"
            name: "The Latency"
            title: "The Lagging Signal"
            failure_mode: "members act on telemetry that is k ticks stale — they see where the weak point WAS, not where it IS (delayed observations; k grows each phase)"
            failure_mode_id: "observation-latency"
            robust_pattern: "delay compensation — read the deterministic telegraph and LEAD (act on the predicted current state); hold when uncertain, never chase stale positions"
            lesson: "Stale telemetry is inevitable under lag; a robust squad reasons about the delay, reads the telegraph, and leads to where the target IS — it never fires at where the readout says it was."
            squad_size: { min: 3, max: 5 }
            recommended_league: "core"
            phases:
              - { phase: 0, name: "First Lag", hp_pct_start: 100, summary: "The exposed cell reads one tick stale; lead one step to land.", telegraphs: ["telemetry_lag"] }
              - { phase: 1, name: "Drift", hp_pct_start: 66, summary: "The lag grows; a strike on the stale cell always misses.", telegraphs: ["telemetry_lag", "lead_window"] }
              - { phase: 2, name: "Ghost Signal", hp_pct_start: 33, summary: "Chasing the ghost never damages the boss; only a led strike lands.", telegraphs: ["ghost_signal", "lead_window"] }
            mechanics: "The boss bares a single exposed cell that sweeps its bar every tick; each member's readout of it lags k ticks (k rises per phase). Only a hit on the TRUE current cell damages the boss — a hit on the stale cell is absorbed. The delayed view is projected into observations only, never into the hashed state; the real damage window is adjudicated on the true current cell."
            deterministic: true

