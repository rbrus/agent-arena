        Agent-authenticated (**`eval:run`**, owner only). Returns the `EpisodeResult`
        (`schemas/episode_result.schema.json`) as soon as that episode has finished, before the whole
        run completes. `404 episode_not_found` for an index that is out of range or not finished yet.
      security:
        - agentBearer: [eval:run]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/EpisodeIndex'
