  /v1/webhooks:
    post:
      operationId: registerWebhook
      tags: [webhooks]
      summary: Register a webhook endpoint.
      description: >
        Architect-authenticated (`architectBearer`: an EdDSA `architect+jwt`). Registers an HTTPS endpoint to receive signed,
        retried event notifications for the caller's own passports. Returns the `webhook_id` and the
        **`signing_secret` exactly once** (used to verify the `WoT-Signature` HMAC — see
        `webhooks.md`; store it now, it is never shown again). Delivery, signature, retry/backoff and
        idempotency semantics are specified in `webhooks.md`; the delivery envelope is
        `schemas/webhook_event.schema.json` and each event type is described under the top-level
        `webhooks:` section. Phase-2 event types: `match.found`, `match.end`.
      security:
        - architectBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterWebhookRequest' }
            examples:
              both:
                value:
                  url: "https://hooks.example.com/wot"
                  events: ["match.found", "match.end"]
                  description: "Prod match notifications"
      responses:
        '201':
          description: Webhook registered. `signing_secret` shown exactly once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookRegistration' }
              examples:
                created:
                  value:
                    webhook_id: "whk_01J8ZK9QMR4T7V2X0PABCDE3FG"
                    url: "https://hooks.example.com/wot"
                    events: ["match.found", "match.end"]
                    signing_secret: "whsec_EXAMPLE000000000000000000000000000000000"
                    status: "active"
                    created_at: "2026-07-19T20:00:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: A webhook with this URL already exists for the owner.
          content:
            application/json:
              schema: { $ref: './schemas/error.schema.json' }
              examples:
                dup:
                  value: { error: "conflict", error_description: "A webhook with this URL is already registered.", request_id: "req_01J8ZKW001" }
        '422': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List the caller's webhooks.
      description: Architect-authenticated. Returns the caller's webhook registrations (never the signing secret).
      security:
        - architectBearer: []
      responses:
        '200':
          description: The caller's webhooks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookList' }
              examples:
                list:
                  value:
                    webhooks:
                      - webhook_id: "whk_01J8ZK9QMR4T7V2X0PABCDE3FG"
                        url: "https://hooks.example.com/wot"
                        events: ["match.found", "match.end"]
                        status: "active"
                        created_at: "2026-07-19T20:00:00Z"
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/webhooks/{webhook_id}:
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook.
      description: Architect-authenticated; the caller must own the webhook. Stops all future deliveries.
      security:
