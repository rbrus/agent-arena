  /v1/runs/{run_id}/report:
    get:
      operationId: getRunReport
      tags: [runs]
      summary: Fetch the run's Report (JSON) or its SARIF 2.1.0 rendering.
      description: >
        Agent-authenticated (**`eval:run`**, owner only). Content-negotiated: `Accept: application/json`
        (default) returns the `Report` (`schemas/report.schema.json`); `Accept: application/sarif+json`
        returns the SARIF 2.1.0 log defined by `sarif-mapping.md` (one SARIF run; rule id
        the oracle id `<scenario|shared|harness>.<name>`; `not_assessed` is never rendered as pass). Both are produced by the
        same code as the local CLI's `report.json` / `report.sarif`, from the same engine build.
        `409 report_not_ready` until the run is `completed` or `failed`.
