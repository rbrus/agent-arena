  /v1/runs/{run_id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Poll an evaluation run.
      description: >
        Agent-authenticated (**`eval:run`**); the caller must own the run (same owner as the submitting
        passport). Returns status and progress; once `completed`, the report is at
        `GET /v1/runs/{run_id}/report`.
      security:
        - agentBearer: [eval:run]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
              examples:
                running: { $ref: '#/components/examples/RunRunningExample' }
                completed: { $ref: '#/components/examples/RunCompletedExample' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/RunNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/runs/{run_id}/episodes/{episode_index}:
    get:
      operationId: getRunEpisode
      tags: [runs]
      summary: Read one episode result.
