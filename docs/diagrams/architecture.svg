<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">Architecture</title>
  <desc id="d">Packages in this repository. arena-cli on top (run, verify, replay, list-scenarios, serve-reference, evidence) imports arena-scenarios (8 scenarios, one interface), arena-report (report.json, SARIF emitter) and wot-contracts (schemas, oracle ids, tiers). arena-scenarios and arena-report import wot-engine (deterministic tick engine, fog of war, replay hash chain, Diplomacy adjudicator). Beside them: the replay inspector (frontend), the reference agents (golden pairs, house bots, no model) and the Docker sandbox.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1b2d"/></marker>
  </defs>
  <rect width="960" height="570" rx="12" fill="#f4f2ec"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#0f1b2d">Architecture</text>
  <text x="24" y="70" font-size="15" fill="#0f1b2d">The packages in this repository. An arrow means “imports”.</text>

  <g fill="#fdfcf9" stroke="#0f1b2d" stroke-width="1.5">
    <rect x="12" y="96" width="660" height="96" rx="10" stroke="#1d6f6a" stroke-width="2.5"/>
    <rect x="12" y="236" width="204" height="96" rx="10"/>
    <rect x="240" y="236" width="204" height="96" rx="10"/>
    <rect x="468" y="236" width="204" height="96" rx="10"/>
    <rect x="12" y="376" width="660" height="110" rx="10"/>
  </g>
  <g fill="#fdfcf9" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="700" y="96" width="248" height="96" rx="10"/>
    <rect x="700" y="236" width="248" height="96" rx="10"/>
    <rect x="700" y="376" width="248" height="110" rx="10"/>
  </g>
  <text x="700" y="88" font-size="14" font-weight="700" fill="#b45309">Beside the packages</text>

  <g font-size="16" font-weight="700" fill="#0f1b2d">
    <text x="28" y="124">arena-cli</text>
    <text x="28" y="264">arena-scenarios</text>
    <text x="256" y="264">arena-report</text>
    <text x="484" y="264">wot-contracts</text>
    <text x="28" y="404">wot-engine</text>
    <text x="716" y="124">replay inspector</text>
    <text x="716" y="264">reference agents</text>
    <text x="716" y="404">Docker sandbox</text>
  </g>
  <g font-size="15" fill="#0f1b2d">
    <text x="112" y="124">npm @sixi4ai/agent-arena, bin agent-arena</text>
    <text x="28" y="152">run · verify · replay · list-scenarios · serve-reference · evidence</text>
    <text x="28" y="176">one bundle, no runtime dependencies, one guarded network layer</text>
    <text x="28" y="292">8 scenarios,</text>
    <text x="28" y="314">one interface</text>
    <text x="256" y="292">report.json,</text>
    <text x="256" y="314">SARIF emitter</text>
    <text x="484" y="292">schemas, oracle ids,</text>
    <text x="484" y="314">tiers</text>
    <text x="28" y="432">deterministic tick engine · fog of war</text>
    <text x="28" y="454">replay hash chain · Diplomacy adjudicator</text>
    <text x="28" y="476">pure: no I/O, no clock, no model</text>
    <text x="716" y="152">frontend/ · a static page</text>
    <text x="716" y="176">opens report.json + replay</text>
    <text x="716" y="292">golden pairs, house bots,</text>
    <text x="716" y="314">no model</text>
    <text x="716" y="432">sandbox/ · one image (the CLI)</text>
    <text x="716" y="454">a reference target and a run;</text>
    <text x="716" y="476">verify.sh checks the anchors</text>
  </g>

  <g stroke="#0f1b2d" stroke-width="2" fill="none">
    <line x1="114" y1="194" x2="114" y2="234" marker-end="url(#ah)"/>
    <line x1="342" y1="194" x2="342" y2="234" marker-end="url(#ah)"/>
    <line x1="570" y1="194" x2="570" y2="234" marker-end="url(#ah)"/>
    <line x1="114" y1="334" x2="114" y2="374" marker-end="url(#ah)"/>
    <line x1="342" y1="334" x2="342" y2="374" marker-end="url(#ah)"/>
  </g>

  <text x="24" y="522" font-size="14" fill="#0f1b2d">Not every import is drawn. Also in packages/: wot-auth, wot-store, wot-ledger (passport auth, storage interfaces, budget ledger).</text>
  <text x="24" y="546" font-size="14" fill="#0f1b2d">The CLI runs the engine in-process; your agent is reached over REST, WS, MCP or A2A.</text>
</svg>
