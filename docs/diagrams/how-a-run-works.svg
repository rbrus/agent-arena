<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">How a run works</title>
  <desc id="d">Eight steps. 1 your agent (REST, WS, MCP or A2A) exchanges observations and actions with 2 agent-arena run, the client. 3 the engine applies seed, scenario, fog of war and budgets. 4 the replay hash chain records one hash per tick. 5 oracles evaluate deterministic predicates over the replay. 6 report.json and SARIF 2.1.0 are written. 7 agent-arena verify re-simulates and recomputes every verdict. 8 a CI job or the GitHub Security tab consumes the result. Transport is outside the hashed state.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1b2d"/></marker>
    <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6f6a"/></marker>
  </defs>
  <rect width="960" height="510" rx="12" fill="#f4f2ec"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#0f1b2d">How a run works</text>
  <text x="24" y="70" font-size="15" fill="#0f1b2d">One episode, from your agent's action to a verdict anyone can re-check.</text>

  <g fill="#fdfcf9" stroke="#0f1b2d" stroke-width="1.5">
    <rect x="12" y="100" width="216" height="120" rx="10"/>
    <rect x="252" y="100" width="216" height="120" rx="10"/>
    <rect x="492" y="100" width="216" height="120" rx="10"/>
    <rect x="732" y="100" width="216" height="120" rx="10"/>
    <rect x="12" y="300" width="216" height="120" rx="10"/>
    <rect x="252" y="300" width="216" height="120" rx="10" stroke="#b45309" stroke-width="2.5"/>
    <rect x="492" y="300" width="216" height="120" rx="10"/>
    <rect x="732" y="300" width="216" height="120" rx="10"/>
  </g>

  <g fill="#1d6f6a">
    <circle cx="34" cy="126" r="14"/><circle cx="274" cy="126" r="14"/><circle cx="514" cy="126" r="14"/><circle cx="754" cy="126" r="14"/>
    <circle cx="754" cy="326" r="14"/><circle cx="514" cy="326" r="14"/><circle cx="34" cy="326" r="14"/>
  </g>
  <circle cx="274" cy="326" r="14" fill="#b45309"/>
  <g font-size="15" font-weight="700" fill="#fdfcf9" text-anchor="middle">
    <text x="34" y="131">1</text><text x="274" y="131">2</text><text x="514" y="131">3</text><text x="754" y="131">4</text>
    <text x="754" y="331">5</text><text x="514" y="331">6</text><text x="274" y="331">7</text><text x="34" y="331">8</text>
  </g>

  <g font-size="16" font-weight="700" fill="#0f1b2d">
    <text x="54" y="132">Your agent</text>
    <text x="294" y="132">agent-arena run</text>
    <text x="534" y="132">Engine</text>
    <text x="774" y="132">Replay hash chain</text>
    <text x="774" y="332">Oracles</text>
    <text x="534" y="332">report.json</text>
    <text x="294" y="332">agent-arena verify</text>
    <text x="54" y="332">CI job</text>
  </g>
  <g font-size="15" fill="#0f1b2d">
    <text x="28" y="164">REST · WS · MCP · A2A</text>
    <text x="28" y="186">observation in,</text>
    <text x="28" y="206">action out</text>
    <text x="268" y="164">the CLI is the client;</text>
    <text x="268" y="186">your agent is the server</text>
    <text x="508" y="164">seed, scenario,</text>
    <text x="508" y="186">fog of war, budgets</text>
    <text x="748" y="164">one hash per tick</text>
    <text x="748" y="364">deterministic predicates</text>
    <text x="748" y="386">over the replay</text>
    <text x="508" y="364">+ SARIF 2.1.0</text>
    <text x="268" y="364">re-simulates, recomputes</text>
    <text x="268" y="386">every verdict</text>
    <text x="28" y="364">exit code 0, 1 or ≥ 2;</text>
    <text x="28" y="386">GitHub Security tab</text>
  </g>

  <g stroke="#1d6f6a" stroke-width="2.5" fill="none">
    <line x1="230" y1="148" x2="250" y2="148" marker-end="url(#aht)"/>
    <line x1="250" y1="176" x2="230" y2="176" marker-end="url(#aht)"/>
  </g>
  <g stroke="#0f1b2d" stroke-width="2" fill="none">
    <line x1="470" y1="160" x2="490" y2="160" marker-end="url(#ah)"/>
    <line x1="710" y1="160" x2="730" y2="160" marker-end="url(#ah)"/>
    <line x1="840" y1="222" x2="840" y2="298" marker-end="url(#ah)"/>
    <line x1="730" y1="360" x2="710" y2="360" marker-end="url(#ah)"/>
    <line x1="490" y1="360" x2="470" y2="360" marker-end="url(#ah)"/>
    <line x1="250" y1="360" x2="230" y2="360" marker-end="url(#ah)"/>
  </g>
  <path d="M20,232 v10 h440 v-10" fill="none" stroke="#1d6f6a" stroke-width="2"/>
  <text x="240" y="264" font-size="14" fill="#1d6f6a" text-anchor="middle">steps 1 and 2 repeat every tick until the episode ends</text>

  <text x="24" y="462" font-size="15" font-weight="700" fill="#0f1b2d">Transport is outside the hashed state.</text>
  <text x="24" y="486" font-size="15" fill="#0f1b2d">The referee, the opponents and the scoring run no model. A pass means these oracles did not fire on these seeds.</text>
</svg>
