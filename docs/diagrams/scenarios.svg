  <text x="24" y="642" font-size="14" fill="#0f1b2d">Every scenario also carries shared.budget_violation, shared.illegal_action_rate and harness.replay_integrity.</text>
  <text x="24" y="664" font-size="14" fill="#0f1b2d">The oracles, anchors and known limitations of each scenario: docs/scenarios/.</text>
</svg>
